# Nixpacks build config for Railway
# Python version
[variables]
NIXPACKS_PYTHON_VERSION = "3.11"

# System packages needed by Playwright Chromium
[phases.setup]
aptPkgs = [
  "libnss3", "libatk1.0-0", "libatk-bridge2.0-0", "libcups2",
  "libdbus-1-3", "libdrm2", "libgbm1", "libgtk-3-0",
  "libxcomposite1", "libxdamage1", "libxfixes3", "libxrandr2",
  "libxss1", "libasound2",
]

# Install Python deps, then install Chromium browser binaries.
# PLAYWRIGHT_BROWSERS_PATH must point inside /app so browsers survive
# into the final runtime image (default ~/.cache gets discarded).
[phases.install]
cmds = [
  "pip install -r requirements.txt",
  "PLAYWRIGHT_BROWSERS_PATH=/app/.pw-browsers playwright install chromium",
]

[start]
cmd = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
